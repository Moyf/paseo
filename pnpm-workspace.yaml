packages:
  - packages/*

nodeLinker: hoisted
linkWorkspacePackages: true
preferWorkspacePackages: true

overrides:
  "@codemirror/language": "6.12.4"
  "@codemirror/view": "6.43.6"
  "lightningcss": "1.30.1"
  "react": "19.1.0"
  "react-dom": "19.1.0"
  "react-native-reanimated": "4.3.1"
  "react-native-worklets": "0.8.3"

onlyBuiltDependencies:
