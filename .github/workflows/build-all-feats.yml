name: Build all-feats desktop

# Builds the desktop app from local/all-feats and publishes artifacts to this
# fork's Releases. The packaged app version stays at the upstream stable base
# (e.g. 0.14.0) so the desktop app and its bundled daemon always report the
# same version — a mismatch makes the desktop restart the daemon on every
# renderer mount. Fork build identity lives in the release tag
# v<upstream version>-af.<yyyymmdd>.<shortsha> (e.g. v0.14.0-af.20261008.40fae44)
# and in the fork build meta the About page renders. Triggered by
# sync-all-feats.yml, or manually.

on:
  # Any push to local/all-feats builds automatically (merge a feature branch
  # and push — no manual step). CI-only edits and docs skip the build.
  push:
    branches:
      - local/all-feats
    paths-ignore:
      - ".github/**"
      - "**/*.md"
      - "scripts/check-fork-release.mjs"
      - "scripts/verify-fork-release-assets.mjs"
      - "scripts/ci-workflow.test.mjs"
      - "scripts/upload-release-assets.test.mjs"
      - "packages/relay/src/e2e.test.ts"
  workflow_dispatch:

concurrency:
  group: build-all-feats-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  DESKTOP_PACKAGE_PATH: packages/desktop

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      base: ${{ steps.version.outputs.base }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify stable upstream baseline
        run: |
          base=$(node -p "require('./package.json').version")
          if [[ ! "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Moy releases require a stable upstream base, not $base."
            exit 1
          fi
          git fetch --no-tags https://github.com/getpaseo/paseo.git \
            "+refs/heads/main:refs/remotes/upstream/main" \
            "refs/tags/v${base}:refs/paseo/upstream/stable/v${base}"
          node scripts/check-fork-release.mjs

      - name: Compute version
        id: version
        run: |
          base=$(node -p "require('./${DESKTOP_PACKAGE_PATH}/package.json').version")
          date=$(date -u +%Y%m%d)
          sha=$(git rev-parse --short HEAD)
          version="${base}-af.${date}.${sha}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "Building tag v$version (app version $base)"

  create-release:
    runs-on: ubuntu-latest
    needs: version
    timeout-minutes: 5
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Create release
        run: |
          # Release notes come from the topmost "## " section of FORK_CHANGELOG.md.
          notes_file="$RUNNER_TEMP/fork-release-notes.md"
          awk 'found && /^## /{exit} /^## /{found=1} found' FORK_CHANGELOG.md > "$notes_file"
          if [[ ! -s "$notes_file" ]]; then
            echo 'Built from `local/all-feats` at ${{ github.sha }}.' > "$notes_file"
          fi
          if ! gh release view "v${VERSION}" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            gh release create "v${VERSION}" \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --title "Paseo all-feats ${VERSION}" \
              --notes-file "$notes_file" \
              --draft
          fi

  build:
    runs-on: ${{ matrix.os }}
    needs: [version, create-release]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            platform_tag: windows-x64
            # Explicit target names override the per-target arch lists in
            # electron-builder.yml; "--win --x64" alone would still build arm64.
            targets: "--win nsis zip --x64"
          - os: macos-14
            name: macos
            platform_tag: macos-arm64
            targets: "--mac --arm64"
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PLATFORM_TAG: ${{ matrix.platform_tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Stamp version
        shell: bash
        env:
          BASE_VERSION: ${{ needs.version.outputs.base }}
        run: |
          node -e "
            const fs = require('node:fs');
            const p = process.env.DESKTOP_PACKAGE_PATH + '/package.json';
            const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
            pkg.version = process.env.BASE_VERSION;
            fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Stamp fork build meta
        shell: bash
        run: node scripts/gen-fork-build-meta.mjs

      - name: Build desktop
        shell: bash
        env:
          EP_GH_IGNORE_TIME: "true"
          # Metro web bundling of packages/app OOMs at Node's default heap on the
          # 7 GB macos-14 runners ("Ineffective mark-compacts near heap limit").
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: |
          set -euo pipefail
          npm run build:desktop -- --publish never ${{ matrix.targets }}

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd "${DESKTOP_PACKAGE_PATH}/release"
          # Only ship the installers and portable zips: drop blockmaps and
          # electron-updater metadata. Name each file with its platform tag.
          uploads=()
          for file in *.exe *.zip *.dmg; do
            [[ -f "$file" ]] || continue
            base="${file%.*}"
            ext="${file##*.}"
            base="${base%-x64}"
            base="${base%-arm64}"
            renamed="${base}-${PLATFORM_TAG}.${ext}"
            mv "$file" "$renamed"
            uploads+=("$renamed")
          done
          if (( ${#uploads[@]} == 0 )); then
            echo "No desktop installers were produced for ${PLATFORM_TAG}."
            exit 1
          fi
          uploads_dir="$RUNNER_TEMP/fork-release-uploads"
          mkdir -p "$uploads_dir"
          for file in "${uploads[@]}"; do
            cp "$file" "$uploads_dir/"
          done
          node "$GITHUB_WORKSPACE/scripts/upload-release-assets.mjs" \
            "v${VERSION}" "$uploads_dir" "${{ github.repository }}"

      - name: Upload workflow artifact backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: |
            ${{ env.DESKTOP_PACKAGE_PATH }}/release/*.exe
            ${{ env.DESKTOP_PACKAGE_PATH }}/release/*.zip
            ${{ env.DESKTOP_PACKAGE_PATH }}/release/*.dmg
            ${{ env.DESKTOP_PACKAGE_PATH }}/release/*.yml
            !${{ env.DESKTOP_PACKAGE_PATH }}/release/builder-debug.yml
          retention-days: 7
          if-no-files-found: ignore

  publish-release:
    runs-on: ubuntu-latest
    needs: [version, build]
    timeout-minutes: 5
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify installers and publish
        env:
          BASE_VERSION: ${{ needs.version.outputs.base }}
        run: |
          manifest="$RUNNER_TEMP/fork-release-assets.json"
          gh release view "v${VERSION}" --repo "${{ github.repository }}" --json assets > "$manifest"
          node scripts/verify-fork-release-assets.mjs "$BASE_VERSION" "$manifest"
          gh release edit "v${VERSION}" --repo "${{ github.repository }}" --draft=false
