name: Sync all-feats

# Daily: merge the newest upstream STABLE release tag (vX.Y.Z, no prerelease
# suffix) into local/all-feats, push to fork, trigger build.
# Upstream beta/main-tip commits are intentionally ignored — builds must
# contain exactly one clean release plus fork features.
# On conflict: open an issue once and fail loudly instead of force-merging.

on:
  schedule:
    # 01:30 UTC = 09:30 UTC+8, once a day
    - cron: "30 1 * * *"
  workflow_dispatch:

concurrency:
  group: sync-all-feats
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  # gh workflow run needs actions:write to dispatch the build workflow.
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: local/all-feats
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Find newest upstream stable tag
        id: tag
        run: |
          git remote add upstream https://github.com/getpaseo/paseo.git
          git fetch upstream --tags --force
          # Prereleases (v0.14.0-beta.1) and fork build tags (v0.13.0-af.*) all
          # contain a dash; a stable release never does.
          latest=$(git tag -l 'v*' | grep -vE -- '-' | sort -V | tail -1)
          if [[ -z "$latest" ]]; then
            echo "No stable tags found upstream."
            exit 1
          fi
          echo "tag=$latest" >> "$GITHUB_OUTPUT"
          echo "Newest upstream stable tag: $latest"

      - name: Skip if tag already merged
        id: check
        run: |
          if git merge-base --is-ancestor "${{ steps.tag.outputs.tag }}" HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "${{ steps.tag.outputs.tag }} is already merged."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge stable tag
        id: merge
        if: steps.check.outputs.changed == 'true'
        run: git merge "${{ steps.tag.outputs.tag }}" --no-edit

      - name: Open issue on conflict
        if: failure() && steps.merge.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge --abort || true
          open_issues=$(gh issue list \
            --repo "${{ github.repository }}" \
            --state open \
            --search "Sync conflict in:title" \
            --json number --jq length)
          if [[ "$open_issues" == "0" ]]; then
            gh issue create \
              --repo "${{ github.repository }}" \
              --title "Sync conflict: upstream stable tag no longer merges cleanly" \
              --body "Daily sync of getpaseo/paseo stable tag \`${{ steps.tag.outputs.tag }}\` into \`local/all-feats\` hit merge conflicts. Resolve locally, push, and the next run builds. Failing run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          exit 1

      - name: Push
        if: steps.check.outputs.changed == 'true'
        run: git push origin HEAD:refs/heads/local/all-feats

      - name: Trigger build
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # gh prefers the `upstream` remote over `origin` when resolving the
          # repo from git remotes, which would dispatch to getpaseo/paseo (404).
          GH_REPO: ${{ github.repository }}
        run: gh workflow run build-all-feats.yml --ref local/all-feats
