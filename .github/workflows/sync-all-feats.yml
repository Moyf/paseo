name: Sync all-feats

# Daily: merge upstream main into local/all-feats, push to fork, trigger build.
# On conflict: open an issue once and fail loudly instead of force-merging.

on:
  schedule:
    # 01:30 UTC = 09:30 UTC+8, once a day
    - cron: "30 1 * * *"
  workflow_dispatch:

concurrency:
  group: sync-all-feats
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: local/all-feats
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/getpaseo/paseo.git
          git fetch upstream main

      - name: Skip if upstream already merged
        id: check
        run: |
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new upstream commits."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream main
        id: merge
        if: steps.check.outputs.changed == 'true'
        run: git merge upstream/main --no-edit

      - name: Open issue on conflict
        if: failure() && steps.merge.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge --abort || true
          open_issues=$(gh issue list \
            --repo "${{ github.repository }}" \
            --state open \
            --search "Sync conflict in:title" \
            --json number --jq length)
          if [[ "$open_issues" == "0" ]]; then
            gh issue create \
              --repo "${{ github.repository }}" \
              --title "Sync conflict: upstream main no longer merges cleanly" \
              --body "Daily sync of getpaseo/paseo \`main\` into \`local/all-feats\` hit merge conflicts. Resolve locally, push, and the next run builds. Failing run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          exit 1

      - name: Push
        if: steps.check.outputs.changed == 'true'
        run: git push origin HEAD:refs/heads/local/all-feats

      - name: Trigger build
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-all-feats.yml --ref local/all-feats
